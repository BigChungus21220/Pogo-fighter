behaviors:
  Bouncing:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 80000
      learning_rate: 0.00002
      beta: 0.0005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    checkpoint_interval: 500000
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 25000
    #init_path: "./Assets/trainedmodels/ppo/Bouncing-base/Bouncing-3315108.pt"
env_settings:
  base_port: 5005
  env_path: "../Build/Pogo-fighter-unity.exe"
  num_envs: 4
  num_areas: 1
  timeout_wait: 60
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
  no_graphics: false
  no_graphics_monitor: false
checkpoint_settings:
  run_id: ppo
  load_model: false
  resume: false
  force: true
  results_dir: Assets/trainedmodels
